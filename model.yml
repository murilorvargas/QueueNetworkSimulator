#==============================================================================
#  MODELO DA REDE DE FILAS
#  Use '#' para comentários
#==============================================================================
#
#  COMO EDITAR ESTE ARQUIVO
#
#  Para definir quantos números pseudoaleatórios serão usados, use 'rndnumbersLimit'
#    rndnumbersLimit: <valor> (ao usar o último, a simulação termina)
#
#  IMPORTANTE:
#    * 'minArrival' e 'maxArrival' só devem existir nas filas listadas em 'arrivals'
#    * Sem 'capacity', a capacidade da fila é infinita
#    * Valores não podem ser negativos, 'servers' e 'capacity' devem ser no mínimo 1
#      e cada 'min' não pode ser maior que o seu 'max'
#    * Em 'network', as probabilidades de cada origem devem somar no máximo 1;
#      o que faltar é a probabilidade de sair da rede
#
#  O restante deste arquivo é autoexplicativo. Boa sorte! :-)
#
#  NÃO APAGUE A PRÓXIMA LINHA INICIADA POR '!'
!PARAMETERS
rndnumbersLimit: 100000

arrivals:
   Q1: 2.0

queues:
   Q1:
      servers: 1
      minArrival: 2.0
      maxArrival: 4.0
      minService: 1.0
      maxService: 2.0
   Q2:
      servers: 2
      capacity: 5
      minService: 4.0
      maxService: 6.0
   Q3:
      servers: 2
      capacity: 10
      minService: 5.0
      maxService: 15.0

network:
-  source: Q1
   target: Q2
   probability: 0.2
-  source: Q1
   target: Q3
   probability: 0.8
-  source: Q2
   target: Q1
   probability: 0.3
-  source: Q2
   target: Q3
   probability: 0.5
-  source: Q3
   target: Q2
   probability: 0.7
